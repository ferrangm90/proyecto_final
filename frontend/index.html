<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PelículasYonkis(Tributo)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

    <header class="bg-warning py-3 mb-4 text-center">
            <h1 class="h3 fw-bold">Películas Yonkis</h1>
    </header>

    <main class="container">
        <section class="card p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="titulo" class="fw-bold">Título de la película</label>
                    <input type="text" class="form-control" id="titulo" placeholder="Ejemplo: Harry Potter">
                </div>
                <div class="col-md-4">
                    <label for="fecha" class="fw-bold">Año (Opcional)</label>
                    <input type="number" class="form-control" id="fecha" placeholder="Ejemplo: 2001">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-warning w-100 fw-bold" id="btnBuscar">Buscar</button>
                </div>
            </div>
        </section>

 
        <div class="row">
            <section id="seccion-resultados" class="col-md-6 mb-4">
                <div class="card">
                    <div class="bg-warning fw-bold h5 py-2 text-center">
                        Resultados
                    </div>
                    <div class="card-body p-3">
                        <table class="table table-hover" id="tabla">
                            <thead>
                                <tr>
                                    <th>Carátula</th>
                                    <th>Título</th>
                                    <th>Año</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="seccion-detalle" class="col-md-6 mb-4">
                <div class="card">
                    <div class="bg-warning fw-bold h5 py-2 text-center">
                        Detalles
                    </div>
                    <div class="card-body p-4">
                        <div id="mensaje" class="text-center py-4">
                            <p>Haz clic en una película de los resultados para ver sus detalles y comentarios</p>
                        </div>
                        <div id="contenido" style="display: none;">
                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <img id="detalle-caratula" src="" class="img-fluid">
                                </div>
                                <div class="col-md-8">
                                    <h3 id="detalle-titulo" class="h4"></h3>
                                    
                                    <p class="fw-bold mb-0">ID OMDb:</p>
                                    <p id="detalle-id-texto"></p>

                                    <p class="fw-bold mb-0">Año:</p>
                                    <p id="detalle-year"></p>

                                    <p class="fw-bold mb-0">Género:</p>
                                    <p id="detalle-genre"></p>

                                    <p class="fw-bold mb-0">Descripción:</p>
                                    <p id="detalle-plot"></p>

                                    <input type="hidden" id="detalle-id-omdb">
                                </div>
                            </div>

                            <h5 class="h6 fw-bold">Comentarios</h5>
                            <div id="lista-comentarios" class="mb-4">
                            </div>
                            <div class="card p-3">
                                <h5 class="fw-bold">Agregar comentario</h5>
                                <div class="mb-2">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
                                </div>
                                <div class="mb-2">
                                    <label for="comentario" class="form-label">Comentario</label>
                                    <textarea class="form-control" id="comentario" rows="4" placeholder="Tu comentario..."></textarea>
                                </div>
                                <button class="btn btn-warning w-100 fw-bold" id="btnGuardarComentario">Guardar Comentario</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
